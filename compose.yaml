
services:

  db:

    image: postgis/postgis:16-3.4

    container_name: let-eat-go-db

    restart: unless-stopped

    ports:

      - "5433:5432"

    environment:

      POSTGRES_USER: postgres

      POSTGRES_PASSWORD: postgres

      POSTGRES_DB: let_eat_go

    volumes:

      - postgres-data:/var/lib/postgresql/data

    healthcheck:

      test: ["CMD-SHELL", "pg_isready -U postgres -d let_eat_go"]

      interval: 5s

      timeout: 5s

      retries: 10



  backend:

    build:

      context: .

      dockerfile: Dockerfile

    container_name: let-eat-go-backend

    ports:

      - "3001:3001"

    environment:

      NODE_ENV: development

      PORT: 3001



      DB_HOST: db

      DB_PORT: 5432

      DB_USERNAME: postgres

      DB_PASSWORD: postgres

      DB_DATABASE_NAME: let_eat_go

      DB_SYNCHRONIZE: "true"



      JWT_SECRET: local-development-secret



      AWS_REGION: ap-northeast-2

      AWS_BUCKET_NAME: local-development-bucket



      CORS_ORIGINS: http://localhost:3005

    depends_on:

      db:

        condition: service_healthy



volumes:

  postgres-data:

